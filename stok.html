
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Buku - BookStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>BookStore</h1>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="stok.html">Katalog Buku</a>
        <a href="checkout.html">Pemesanan</a>
        <a href="tracking.html">Tracking</a>
        <a href="#" id="btnLogout">Logout</a>
    </nav>
</header>

<main class="container">

    <h2>Informasi Stok / Katalog Buku</h2>

    <p>Berikut adalah daftar buku yang tersedia di toko.</p>

    <div id="daftarBuku" class="card-container"></div>

    <hr>

    <h2 class="judul-tambah-stok">Tambah Stok Buku Baru</h2>

    <form id="formTambahStok">

        <label for="kodeBarang">Kode Barang</label>
        <input type="text" id="kodeBarang" required>

        <label for="namaBarang">Nama Buku</label>
        <input type="text" id="namaBarang" required>

        <label for="jenisBarang">Jenis Barang</label>
        <select id="jenisBarang" required>
            <option value="">Pilih jenis</option>
            <option value="Buku Ajar">Buku Ajar</option>
            <option value="Buku Referensi">Buku Referensi</option>
            <option value="Novel">Novel</option>
        </select>

        <label for="edisi">Edisi</label>
        <input type="number" id="edisi" min="1" required>

        <label for="stok">Jumlah Stok</label>
        <input type="number" id="stok" min="0" required>

        <label for="harga">Harga</label>
        <input type="text" id="harga" placeholder="Contoh: Rp 100.000" required>

        <button type="submit">Tambah Buku</button>

    </form>

<button type="button" id="btnDataStok" class="btn-stok">
    Data Stok Buku ▼
</button>

<div id="containerDataStok" style="display: none;">

    <table>
        <thead>
            <tr>
                <th>Kode</th>
                <th>Nama Buku</th>
                <th>Jenis</th>
                <th>Edisi</th>
                <th>Stok</th>
                <th>Harga</th>
            </tr>
        </thead>

        <tbody id="tabelStok"></tbody>
    </table>

</div>
</main>

<footer>
    <p>&copy; Azka BookStore</p>
</footer>

<script src="js/data.js"></script>
<script src="js/script.js"></script>

</body>
</html>
