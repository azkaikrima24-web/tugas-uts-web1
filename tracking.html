<main class="container">

    <h2>Informasi Pengiriman</h2>

    <p>Masukkan nomor Delivery Order untuk melihat status pengiriman.</p>

    <form id="formTracking">

        <label for="nomorDO">Nomor Delivery Order</label>
        <input
            type="text"
            id="nomorDO"
            placeholder="Contoh: 20230012"
            required
        >

        <button type="submit">Cari</button>

    </form>

    <div id="hasilTracking"></div>

</main>
